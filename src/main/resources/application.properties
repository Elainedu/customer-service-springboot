# 應用程式設定：伺服器 port、SQLite 資料庫路徑、本地 LLM（llama.cpp）連線資訊

# ── 伺服器設定 ──────────────────────────────────────────────
# Spring Boot 內建的 Tomcat Web Server 監聽的 port
# 用 8081 是因為 llama.cpp 預設占用 8080
server.port=8081

# ── SQLite 資料庫設定 ────────────────────────────────────────
# JDBC 連線字串，chat.db 是相對路徑，會在執行目錄下自動建立
spring.datasource.url=jdbc:sqlite:chat.db
# SQLite 的 JDBC 驅動程式類別名稱
spring.datasource.driver-class-name=org.sqlite.JDBC
# 告訴 Hibernate 使用 SQLite 專用的語法（社群版 dialect）
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# update：啟動時自動根據 Entity 建立或更新資料表，不刪除現有資料
# 其他選項：create（每次重建）、create-drop（結束時刪除）、validate（只驗證不修改）
spring.jpa.hibernate.ddl-auto=update
# 不在 console 印出每次執行的 SQL 語句（設 true 可用來除錯）
spring.jpa.show-sql=false
# SQLite 不支援多執行緒同時寫入，連線池最大連線數限制為 1，避免衝突
spring.datasource.hikari.maximum-pool-size=1

# ── 本地 LLM 設定 ────────────────────────────────────────────
# llama.cpp 伺服器的位址，需與實際啟動的 IP/port 一致
llm.base-url=http://192.168.31.250:8080
# 傳給 LLM API 的 model 名稱，llama.cpp 會忽略此值，填任意字串即可
llm.model=local-model
